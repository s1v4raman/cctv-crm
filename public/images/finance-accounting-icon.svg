<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="fin-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fin-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="fin-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="fin-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1D4ED8" flood-opacity="0.45"/>
    </filter>
    <filter id="coin-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350F" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#fin-bg)" filter="url(#fin-shadow)"/>
  
  <!-- Subtle Top Highlight Rim -->
  <rect x="5" y="5" width="54" height="26" rx="15" fill="url(#fin-glow)"/>
  
  <!-- Outer Subtle Stroke -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Analytics Ledger Card Surface -->
  <rect x="13" y="16" width="38" height="26" rx="7" fill="url(#fin-card)" stroke="#93C5FD" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Growth Bar Charts -->
  <rect x="18" y="30" width="5" height="8" rx="2" fill="#93C5FD" fill-opacity="0.9"/>
  <rect x="26" y="25" width="5" height="13" rx="2" fill="#60A5FA"/>
  <rect x="34" y="21" width="5" height="17" rx="2" fill="#38BDF8"/>
  <rect x="42" y="27" width="5" height="11" rx="2" fill="#93C5FD" fill-opacity="0.6"/>

  <!-- Trend Curve Line -->
  <path d="M18 29 L28 23 L36 19 L44 24" stroke="#FDE047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="36" cy="19" r="2" fill="#FDE047"/>

  <!-- Golden Currency Coin / Emblem Overlap -->
  <g filter="url(#coin-shadow)">
    <circle cx="43" cy="41" r="11" fill="url(#fin-gold)"/>
    <circle cx="43" cy="41" r="9" stroke="#FEF08A" stroke-width="1" fill="none" stroke-opacity="0.8"/>
    <!-- Currency / Value Symbol -->
    <path d="M43 35v12M40 37.5h5.5a2 2 0 010 4H41a2 2 0 000 4h5.5" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

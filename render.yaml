services:
  - type: web
    name: securevision-crm
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: SecureVision CRM
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-little-firefly-aolx73by-pooler.c-2.ap-southeast-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        # Secret: set in the Render dashboard (Environment), never in git
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        # Secret: set in the Render dashboard (Environment), never in git
        sync: false
      - key: DB_PERSISTENT
        value: "true"
      - key: AUTO_MIGRATE
        value: "true"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "4320"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

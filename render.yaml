services:
  - type: web
    name: securevision-crm
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: SecureVision CRM
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-odd-sky-b55wmpnc.c-7.us-east-2.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_hb9lqafutc2E
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_hb9lqafutc2E@ep-odd-sky-b55wmpnc.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: AUTO_MIGRATE
        value: "true"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "4320"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

services:
  - type: web
    name: securevision-crm
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: SecureVision CRM
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-little-firefly-aolx73by-pooler.c-2.ap-southeast-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        # Secret: set in the Render dashboard (Environment), never in git
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        # Secret: set in the Render dashboard (Environment), never in git
        sync: false
      - key: DB_PERSISTENT
        value: "true"
      - key: AUTO_MIGRATE
        value: "true"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "4320"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # Password reset emails. Render's free plan blocks SMTP ports 25, 465 and 587, so use a
      # provider that also listens on 2525 (Brevo, SendGrid, Mailgun) and fill these in the
      # dashboard. Until MAIL_MAILER is set, mail is only written to the log.
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_TIMEOUT
        value: "15"
